name: ivoire_quiz
description: Quiz de culture générale ivoirienne
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.1.0

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # API
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.0

  # UI
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  percent_indicator: ^4.2.3

  # UX
  fluttertoast: ^9.0.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Auth
  google_sign_in: ^6.2.1

  # Device
  vibration: ^2.0.0   # 🔥 version stable

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.13.1   # 🔥 important

  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true