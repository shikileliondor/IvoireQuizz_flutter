name: ivoire_quiz
description: Quiz de culture générale ivoirienne
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # État
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # API
  dio: ^5.4.0

  # Stockage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # UI
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  percent_indicator: ^4.2.3

  # UX
  vibration: ^1.8.4
  fluttertoast: ^8.2.4

  # Utilitaires
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Google Sign In
  google_sign_in: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  freezed: ^2.5.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/lottie/